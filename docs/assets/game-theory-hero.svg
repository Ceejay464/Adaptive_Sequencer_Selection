<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title description">
<title id="title">One toolkit. Three ways to reason about a game.</title>
<desc id="description">Nash: a prisoner&#x27;s dilemma matrix highlights mutual defection. Selten: an entry tree highlights entry followed by accommodation. Harsanyi: Nature selects a cost; dotted information sets join indistinguishable nodes. These are three distinct teaching models.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">

<rect width="1200" height="690" rx="20" fill="#FFFFFF"/>
<path d="M 40 28 H 1160" stroke="#315EFB" stroke-width="4"/>
<text x="40" y="65" font-size="17" font-weight="700" text-anchor="start" fill="#315EFB">COMSCI / ECON 206  ·  WEEK 3</text>
<text x="40" y="106" font-size="31" font-weight="700" text-anchor="start" fill="#18324A">What changes when the rules of interaction change?</text>
<text x="40" y="138" font-size="20" font-weight="400" text-anchor="start" fill="#52677C">Compare three small models. Change one assumption. Explain the new prediction.</text>
<line x1="403" y1="177" x2="403" y2="558" stroke="#CBD5E1" stroke-width="2"/>
<line x1="796" y1="177" x2="796" y2="558" stroke="#CBD5E1" stroke-width="2"/>
<text id="nash-label" x="40" y="196" font-size="28" font-weight="700" text-anchor="start" fill="#18324A">Nash</text>
<text x="40" y="228" font-size="19" font-weight="400" text-anchor="start" fill="#52677C">Can either player gain alone?</text>
<text id="selten-label" x="435" y="196" font-size="28" font-weight="700" text-anchor="start" fill="#18324A">Selten</text>
<text x="435" y="228" font-size="19" font-weight="400" text-anchor="start" fill="#52677C">Is the threat credible?</text>
<text id="harsanyi-label" x="830" y="196" font-size="28" font-weight="700" text-anchor="start" fill="#18324A">Harsanyi</text>
<text x="830" y="228" font-size="19" font-weight="400" text-anchor="start" fill="#52677C">What does each player know?</text>
<g id="nash-matrix">
<text x="239" y="270" font-size="18" font-weight="400" text-anchor="middle" fill="#52677C">Column player</text>
<text x="190" y="301" font-size="19" font-weight="700" text-anchor="middle" fill="#18324A">C</text>
<text x="300" y="301" font-size="19" font-weight="700" text-anchor="middle" fill="#18324A">D</text>
<rect x="135" y="315" width="220" height="124" rx="8" fill="#F5F7FB"/>
<rect x="245" y="377" width="110" height="62" rx="6" fill="#315EFB"/>
<line x1="245" y1="315" x2="245" y2="439" stroke="#CBD5E1" stroke-width="2"/>
<line x1="135" y1="377" x2="355" y2="377" stroke="#CBD5E1" stroke-width="2"/>
<text x="112" y="354" font-size="19" font-weight="700" text-anchor="middle" fill="#18324A">C</text>
<text x="112" y="416" font-size="19" font-weight="700" text-anchor="middle" fill="#18324A">D</text>
<text x="40" y="339" font-size="18" font-weight="400" text-anchor="start" fill="#52677C">Row</text>
<text x="40" y="363" font-size="18" font-weight="400" text-anchor="start" fill="#52677C">player</text>
<text x="190" y="354" font-size="22" font-weight="400" text-anchor="middle" fill="#18324A">3, 3</text>
<text x="300" y="354" font-size="22" font-weight="400" text-anchor="middle" fill="#18324A">0, 5</text>
<text x="190" y="416" font-size="22" font-weight="400" text-anchor="middle" fill="#18324A">5, 0</text>
<text x="300" y="416" font-size="22" font-weight="700" text-anchor="middle" fill="#FFFFFF">1, 1</text>
</g>
<text x="40" y="478" font-size="22" font-weight="700" text-anchor="start" fill="#315EFB">NE: both defect</text>
<text x="40" y="509" font-size="18" font-weight="400" text-anchor="start" fill="#52677C">C = cooperate; D = defect</text>
<text x="40" y="538" font-size="18" font-weight="400" text-anchor="start" fill="#52677C">Payoffs: row, column</text>
<g id="selten-tree">
<line x1="585" y1="285" x2="466" y2="382" stroke="#CBD5E1" stroke-width="2"/>
<line x1="585" y1="285" x2="690" y2="360" stroke="#315EFB" stroke-width="4"/>
<line x1="690" y1="360" x2="627" y2="432" stroke="#CBD5E1" stroke-width="2"/>
<line x1="690" y1="360" x2="751" y2="432" stroke="#315EFB" stroke-width="4"/>
<text x="585" y="267" font-size="19" font-weight="700" text-anchor="middle" fill="#18324A">Entrant</text>
