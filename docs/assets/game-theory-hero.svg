<text x="670" y="332" font-size="18" font-weight="700" text-anchor="start" fill="#315EFB">In</text>
<text x="698" y="307" font-size="18" font-weight="700" text-anchor="middle" fill="#18324A">Incumbent</text>
<text x="605" y="390" font-size="17" font-weight="400" text-anchor="start" fill="#52677C">Fight</text>
<text x="712" y="379" font-size="16" font-weight="700" text-anchor="start" fill="#315EFB">Accom.</text>
<circle cx="585" cy="285" r="6" fill="#315EFB"/>
<circle cx="690" cy="360" r="6" fill="#315EFB"/>
<circle cx="466" cy="382" r="4" fill="#52677C"/>
<circle cx="627" cy="432" r="4" fill="#52677C"/>
<circle cx="751" cy="432" r="6" fill="#315EFB"/>
<text x="466" y="412" font-size="19" font-weight="400" text-anchor="middle" fill="#18324A">0, 2</text>
<text x="622" y="461" font-size="19" font-weight="400" text-anchor="middle" fill="#18324A">−1, −1</text>
<text x="751" y="461" font-size="19" font-weight="700" text-anchor="middle" fill="#315EFB">1, 1</text>
</g>
<text x="435" y="500" font-size="20" font-weight="700" text-anchor="start" fill="#315EFB">SPNE: enter; accommodate</text>
<text x="435" y="533" font-size="18" font-weight="400" text-anchor="start" fill="#52677C">After entry, 1 is better than −1.</text>
<g id="harsanyi-information">
